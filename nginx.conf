server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve files directly when they exist, otherwise fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: return 404 for missing asset files
  location /assets/ {
    try_files $uri $uri/ =404;
  }

  # Increase client body size in case of large uploads
  client_max_body_size 10M;
}
